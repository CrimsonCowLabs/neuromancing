# Showcase: Bollinger %B breakout confirmed by price above rolling VWAP. Exercises
# bbpercent (crossing), vwap, and an indicator-vs-indicator comparison (px > vwap,
# where px is sma(1) as a close proxy).
name: Bollinger Breakout + VWAP
kind: indicator_dsl
spec:
  type: breakout
  base_timeframe: 5m
  indicators:
    - {id: bbpct, fn: bbpercent, period: 20, mult: 2.0, source: close, timeframe: 5m}
    - {id: px, fn: sma, period: 1, source: close, timeframe: 5m}
    - {id: vw, fn: vwap, period: 20, timeframe: 5m}
  states:
    breakout: {indicator: bbpct, cross: above, value: 1.0}
    above_vwap: {indicator: px, op: ">", other: vw}
  buy_when:
    all: [breakout, above_vwap]
  exit_when:
    any:
      - {indicator: bbpct, op: "<", value: 0.5}
