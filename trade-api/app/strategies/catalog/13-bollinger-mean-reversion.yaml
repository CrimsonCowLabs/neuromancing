# Mean-reversion showcase (fits contrarian-cara). Buy when price pierces the lower
# Bollinger band (%B crosses below 0) AND RSI is oversold; exit on reversion back to
# the middle band or a hot RSI. Single-timeframe (5m). Exercises bbpercent + rsi.
name: Bollinger Mean Reversion
kind: indicator_dsl
spec:
  type: mean_reversion
  base_timeframe: 5m
  indicators:
    - {id: bbpct, fn: bbpercent, period: 20, mult: 2.0, source: close, timeframe: 5m}
    - {id: rsi14, fn: rsi, period: 14, source: close, timeframe: 5m}
  states:
    pierce_lower: {indicator: bbpct, cross: below, value: 0.0}
    oversold: {indicator: rsi14, op: "<", value: 35}
  buy_when:
    all: [pierce_lower, oversold]
  exit_when:
    any:
      - {indicator: bbpct, op: ">", value: 0.5}
      - {indicator: rsi14, op: ">", value: 60}
  strength:
    buy: {from: rsi14, map: [35, 15]}
