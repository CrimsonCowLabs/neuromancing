# Neuromancing — single Compose stack (Docker or any Docker-compatible runtime).
# Base file only; put local-only tweaks in a gitignored docker-compose.override.yml
# (e.g. a PGDATA remap if your platform needs one for Postgres 18).

x-app-env: &app-env
  env_file: [.env]

services:
  db:
    # Postgres 18 + TimescaleDB. Verify/pin the exact tag published for your arch.
    image: timescale/timescaledb:latest-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Internal only (not published to the host). Use
    # `docker compose exec db psql ...` for access.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Temporal (durable orchestration; backed by its own Postgres) ----
  temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporaldb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    # Internal only (reachable at temporal:7233 on the compose network).

  temporal-ui:
    image: temporalio/ui:2.31.0
    restart: unless-stopped
    depends_on: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      # Temporal UI on host 8101.
      - "8101:8080"

  # ---- Application services ----
  trade-api:
    <<: *app-env
    build: { context: ., dockerfile: trade-api/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Reads the Parquet archive (deep history / marks fallback) read-only.
    volumes:
      - bardata:/data/bars:ro
    # Internal only (trade-api:8000 on the compose network).

  game-api:
    <<: *app-env
    build: { context: ., dockerfile: game-api/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      trade-api: { condition: service_started }
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - bardata:/data/bars:ro
    # Internal only (game-api:8000 on the compose network; browser reaches it
    # only via the Next.js BFF).

  temporal-worker:
    <<: *app-env
    build: { context: ., dockerfile: game-api/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_started }
      trade-api: { condition: service_started }
    command: ["uv", "run", "python", "-m", "app.workflows.worker"]
    # decide_activity → build_context → get_marks may read the Parquet fallback.
    volumes:
      - bardata:/data/bars:ro

  market-ingest:
    <<: *app-env
    build: { context: ., dockerfile: game-api/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["uv", "run", "python", "-m", "app.ingest.main"]
    # The SINGLE writer of the bar plane — bardata is read-write here only.
    volumes:
      - bardata:/data/bars

  web:
    <<: *app-env
    build: { context: ./web, dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      game-api: { condition: service_started }
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  temporaldb:
  bardata:  # Parquet bar archive; rw on market-ingest, ro on readers
